<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Library demo</title>
    <!-- Dev only (Vite builds index.html alone): the scripted walkthrough of src/demo/ on an iPhone-sized screen. -->
    <style>
      :root { --page: #f5f4f0; --fit: 1; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        background: #1b1b1d;
        color: #e8e6e1;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        overflow: hidden;
      }
      /* An iPhone 15's screen: 393 × 852 pt, the status bar over 798 pt of page. Scaled to fit the window. */
      .fit { width: calc(393px * var(--fit)); height: calc(852px * var(--fit)); flex: none; }
      .screen {
        position: relative;
        width: 393px;
        height: 852px;
        transform: scale(var(--fit));
        transform-origin: 0 0;
        border-radius: 55px;
        overflow: hidden;
        background: var(--page);
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.45);
      }
      .status { position: absolute; inset: 0 0 auto; height: 54px; color: #000; background: var(--page); }
      .status .time { position: absolute; left: 0; width: 118px; top: 17px; text-align: center; font-weight: 600; font-size: 17px; letter-spacing: -0.2px; }
      .status .icons { position: absolute; right: 26px; top: 21px; display: flex; gap: 6px; align-items: center; }
      iframe { position: absolute; top: 54px; left: 0; width: 393px; height: 798px; border: 0; display: block; }
      /* The real mouse stays out: the site would take it for a hover on the shelf. */
      .shield { position: absolute; inset: 0; }
      .home { position: absolute; left: 50%; bottom: 8px; width: 139px; height: 5px; margin-left: -69.5px; border-radius: 3px; background: #000; pointer-events: none; }
      .controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
      button, select {
        font: inherit;
        color: inherit;
        background: #2c2c2f;
        border: 1px solid #3a3a3e;
        border-radius: 8px;
        padding: 6px 12px;
      }
      button { cursor: pointer; }
      button:hover { background: #36363a; }
      .where { min-width: 260px; font-variant-numeric: tabular-nums; color: #a9a7a1; }
      .clean .controls { display: none; }
      .clean { background: transparent; justify-content: flex-start; align-items: flex-start; }
      .clean .screen { border-radius: 0; box-shadow: none; }
    </style>
  </head>
  <body>
    <div class="fit">
      <div class="screen" id="screen">
        <div class="status" aria-hidden="true">
          <div class="time">9:41</div>
          <div class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1" /><rect x="5" y="5.5" width="3" height="6.5" rx="1" /><rect x="10" y="3" width="3" height="9" rx="1" /><rect x="15" y="0" width="3" height="12" rx="1" /></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C14 1.7 11.4.6 8.5.6S3 1.7 1.1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2C12.2 4.7 10.4 4 8.5 4S4.8 4.7 3.5 6l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6z" /></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.8" fill="none" stroke="#000" stroke-opacity=".35" /><rect x="2" y="2" width="20" height="9" rx="2.5" /><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill-opacity=".4" /></svg>
          </div>
        </div>
        <iframe id="site" title="The site, played by the demo script"></iframe>
        <div class="shield"></div>
        <div class="home"></div>
      </div>
    </div>
    <div class="controls">
      <button id="replay" type="button" title="Replay (R)">↻ Replay</button>
      <select id="from" aria-label="Start from"><option value="">From the start</option></select>
      <select id="lang" aria-label="Language">
        <option value="en">English</option>
        <option value="es">Español</option>
      </select>
      <span class="where" id="where">loading…</span>
    </div>
    <script type="module" src="/src/demo/stage.ts"></script>
  </body>
</html>
