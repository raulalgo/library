<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- One of the oak stools, front view, on the island's blue (island-blue in style.css). Proportions from build_stool() in blender/build_island.py. -->
  <rect width="64" height="64" rx="14" fill="#4d74b1"/>
  <!-- legs and front rung; they stop short of the seat so the blue shows between -->
  <path d="M21.5 28 L18.5 57 M42.5 28 L45.5 57 M20.5 41.5 H43.5" stroke="#e6d5bf" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- seat -->
  <rect x="15" y="8" width="34" height="13" rx="6" fill="#efe2cf"/>
</svg>
